<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>土豆兄弟 - Potato Brothers</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.3.2/dist/pixi.min.js"></script>
  </head>
  <body>
    <div id="game-container">
      <!-- UI覆盖层 -->
      <div id="ui-overlay">
        <!-- 主菜单 -->
        <div id="main-menu" class="ui-screen">
          <div class="menu-kicker">SMALL HEROES. BIG SURVIVAL.</div>
          <h1 class="game-title">土豆兄弟<span class="title-dot">.</span></h1>
          <p class="game-subtitle">POTATO BROTHERS / 生存试炼</p>
          <p class="menu-intro">挑一位小英雄，在一波又一波的挑战中生存下来。</p>
          <div class="menu-buttons">
            <button id="btn-start" class="menu-btn menu-btn-primary">
              开始游戏
            </button>
            <button id="btn-settings" class="menu-btn menu-btn-secondary">
              设置
            </button>
          </div>
          <div class="controls-hint">
            <p>WASD / 方向键移动 · 自动瞄准射击 · ESC 暂停</p>
          </div>
        </div>
        <div id="settings-screen" class="ui-screen hidden">
          <div class="settings-panel">
            <h2>画面设置</h2>
            <label
              ><input id="reduce-motion" type="checkbox" />
              减少晃动与闪光</label
            >
            <p>关闭镜头震动、角色弹跳和枪口闪光。随时可再次开启。</p>
            <button id="btn-close-settings" class="menu-btn menu-btn-primary">
              完成
            </button>
          </div>
        </div>
        <!-- 角色选择界面 -->
        <div id="character-select" class="ui-screen hidden">
          <h2 class="char-select-title">选择你的土豆</h2>
          <div class="char-grid" id="char-grid"></div>
          <div class="char-detail" id="char-detail">
            <p class="char-detail-hint">← 选择一个角色</p>
          </div>
          <div class="char-actions">
            <button
              id="btn-confirm-char"
              class="menu-btn menu-btn-primary"
              disabled
            >
              开始游戏
            </button>
            <button id="btn-back-menu" class="menu-btn menu-btn-secondary">
              返回
            </button>
          </div>
        </div>
        <!-- 游戏HUD -->
        <div id="game-hud" class="ui-screen hidden">
          <div class="hud-top">
            <div class="hud-wave">波次: <span id="wave-number">1</span></div>
            <div class="hud-timer">剩余: <span id="wave-timer">30</span>秒</div>
            <div class="hud-enemies">敌人: <span id="enemy-count">0</span></div>
            <button id="btn-pause" class="hud-pause-btn" title="暂停 (ESC)">
              ⏸
            </button>
          </div>
          <div class="hud-bottom">
            <div class="hud-health">
              <div class="health-bar">
                <div id="health-fill" class="health-fill"></div>
              </div>
              <span id="health-text">100/100</span>
            </div>
            <div class="hud-xp">
              <div class="xp-bar">
                <div id="xp-fill" class="xp-fill"></div>
              </div>
              <span id="level-text">Lv.1</span>
            </div>
            <div class="hud-weapon">
              <span id="weapon-name">手枪</span>
              <span id="weapon-level">Lv.1</span>
            </div>
          </div>
          <div class="hud-items" id="items-container"></div>
        </div>
        <!-- 商店界面 -->
        <div id="shop-screen" class="ui-screen hidden">
          <h2>商店</h2>
          <div class="shop-timer">
            剩余时间: <span id="shop-timer">15</span>秒
          </div>
          <div class="shop-items" id="shop-items-container"></div>
          <div class="shop-gold">金币: <span id="gold-amount">0</span></div>
          <button id="btn-continue" class="menu-btn menu-btn-primary">
            继续游戏
          </button>
        </div>
        <!-- 暂停界面 -->
        <div id="pause-screen" class="ui-screen hidden">
          <h2>游戏暂停</h2>
          <div class="pause-content">
            <div class="pause-stats" id="pause-stats">
              <div class="stats-header">
                <span id="pause-char-icon">🥔</span>
                <span id="pause-char-name">全能者</span>
              </div>
              <div class="stats-grid" id="pause-stats-grid"></div>
            </div>
            <div class="pause-weapons" id="pause-weapons">
              <h3>武器</h3>
              <div id="pause-weapons-list"></div>
            </div>
          </div>
          <div class="menu-buttons">
            <button id="btn-resume" class="menu-btn menu-btn-primary">
              继续游戏
            </button>
            <button id="btn-quit" class="menu-btn menu-btn-secondary">
              退出到菜单
            </button>
          </div>
        </div>
        <!-- 游戏结束界面 -->
        <div id="gameover-screen" class="ui-screen hidden">
          <h2>💀 游戏结束</h2>
          <div class="gameover-stats">
            <p>存活波次: <span id="final-wave">0</span></p>
            <p>击杀数: <span id="final-kills">0</span></p>
            <p>存活时间: <span id="final-time">0</span>秒</p>
          </div>
          <div class="menu-buttons">
            <button id="btn-retry" class="menu-btn menu-btn-primary">
              再来一局
            </button>
            <button id="btn-menu" class="menu-btn menu-btn-secondary">
              返回菜单
            </button>
          </div>
        </div>
        <!-- 成就界面 (已隐藏)
            <div id="achievements-screen" class="ui-screen hidden">
                <h2>成就</h2>
                <div class="achievements-list" id="achievements-container"></div>
                <button id="btn-back" class="menu-btn">返回</button>
            </div> -->
        <!-- 升级选择界面 -->
        <div id="levelup-screen" class="ui-screen hidden">
          <h2>升级!</h2>
          <p>选择一项强化:</p>
          <div class="levelup-options" id="levelup-options-container"></div>
        </div>
      </div>
    </div>
    <!-- 游戏脚本 -->
    <script src="js/config.js"></script>
    <script src="js/utils/math.js"></script>
    <script src="js/utils/pool.js"></script>
    <script src="js/input.js"></script>
    <script src="js/entities/projectile.js"></script>
    <script src="js/entities/enemy.js"></script>
    <script src="js/entities/boss.js"></script>
    <script src="js/visuals.js"></script>
    <script src="js/entities/player.js"></script>
    <script src="js/systems/weapon.js"></script>
    <script src="js/systems/wave.js"></script>
    <script src="js/systems/item.js"></script>
    <script src="js/systems/collision.js"></script>
    <script src="js/ui/hud.js"></script>
    <script src="js/ui/menu.js"></script>
    <script src="js/ui/shop.js"></script>
    <script src="js/ui/levelup.js"></script>
    <script src="js/camera.js"></script>
    <script src="js/systems/character.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
